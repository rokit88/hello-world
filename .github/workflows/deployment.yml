name: Deployment
run-name: 'Deployment: ${{ inputs.tag }}'

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 'Tag'
        required: true

permissions:
  contents: write

jobs:
  deploy-tag-qa:
    name: 'Deploy to qa'
    uses: ./.github/workflows/something.yml
    with:
      tag: "qa"

  deploy-qa:
    name: 'Environment: qa'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - run: echo "Begin deployment ..."

  deploy-stage:
    name: 'Environment: stage'
    needs: [deploy-qa]
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - run: echo "Stage pending approval ..."
      
  deploy-tag-stage:
    name: 'Deploy to stage'
    needs: deploy-stage
    uses: ./.github/workflows/something.yml
    with:
      tag: "stage"
      
  deploy-prod:
    name: 'Environment: prod'
    needs: [deploy-tag-stage]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "Prod pending approval ..."

  deploy-tag-prod:
    name: 'Deploy to prod'
    needs: deploy-prod
    uses: ./.github/workflows/something.yml
    with:
      tag: "prod"
