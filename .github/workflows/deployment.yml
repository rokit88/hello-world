name: Deployment
run-name: 'Deployment: ${{ inputs.tag }}'

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 'Tag'
        required: true

permissions:
  contents: write

jobs:
  deploy-qa:
    name: 'Deploy to qa'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - run: echo "Deploying to qa ..."

  deploy-stage:
    name: 'Deploy to stage'
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - run: echo "Deploying to stage ..."

  deploy-prod:
    name: 'Deploy to prod'
    needs: deploy-stage
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "Deploying to prod ..."
