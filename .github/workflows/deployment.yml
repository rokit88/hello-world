name: Deployment
run-name: 'Deployment: ${{ inputs.tag }}'

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 'Tag'
        required: true

permissions:
  contents: write

jobs:
  deploy-tag-qa:
    uses: ./.github/workflows/something.yml
    with:
      tag: ${{ inputs.tag }}

  deploy-qa:
    name: 'QA'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - run: echo "Verifying qa ..."
      
  deploy-tag-stage:
    needs: deploy-qa
    uses: ./.github/workflows/something.yml
    with:
      tag: ${{ inputs.tag }}

  deploy-stage:
    name: 'STAGE'
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - run: echo "Verifying stage ..."
      
  deploy-tag-prod:
    needs: deploy-stage
    uses: ./.github/workflows/something.yml
    with:
      tag: ${{ inputs.tag }}
      
  deploy-prod:
    name: 'PROD'
    needs: deploy-stage
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "Verifying prod ..."
